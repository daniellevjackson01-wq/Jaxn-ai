<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}JAXN Assist{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('chat') }}">JAXN <span>ASSIST</span></a>{% if user %}<nav><a href="{{ url_for('chat') }}">Ask JAXN</a>{% if user['role']=='admin' %}<a href="{{ url_for('admin') }}">Admin</a><a href="{{ url_for('upload') }}">Upload</a>{% endif %}<a href="{{ url_for('logout') }}">Sign out</a></nav>{% endif %}</header><main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
